<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <defs>
    <!-- Gradient 1: Top Outer Petal (Yellow to Orange) -->
    <linearGradient id="kauvery-petal-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E60067" />
    </linearGradient>

    <!-- Gradient 2: Inner Petal (Pink to Magenta) -->
    <linearGradient id="kauvery-petal-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#8A1562" />
    </linearGradient>

    <!-- Gradient 3: Bottom Petal (Deep Magenta) -->
    <linearGradient id="kauvery-petal-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91B5C" />
      <stop offset="100%" stop-color="#670845" />
    </linearGradient>
  </defs>

  <!-- Kauvery Butterfly / Petal Symbol -->
  <g transform="translate(230, 2)">
    <!-- Top Large Petal -->
    <path d="M 32 10 C 50 -2, 75 8, 70 28 C 65 44, 42 45, 30 38 C 22 34, 20 20, 32 10 Z" fill="url(#kauvery-petal-top)" opacity="0.95" />
    
    <!-- Inner Radiant Wing -->
    <path d="M 28 22 C 42 12, 60 22, 54 36 C 48 48, 30 46, 22 38 C 18 34, 18 26, 28 22 Z" fill="url(#kauvery-petal-inner)" opacity="0.85" />
    
    <!-- Bottom Petal -->
    <path d="M 8 36 C -4 20, 15 15, 28 28 C 38 38, 32 52, 18 52 C 10 52, 2 44, 8 36 Z" fill="url(#kauvery-petal-bottom)" opacity="0.9" />
  </g>

  <!-- Typography -->
  <!-- "kauvery" in deep magenta / plum -->
  <text x="10" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="currentColor" letter-spacing="-1">kauvery</text>

  <!-- "hospital" in sleek grey -->
  <text x="12" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="28" fill="#8E9BAE" letter-spacing="1">hospital</text>
</svg>
