    <!-- Bottom Petal -->
    <path d="M 12 40 C -2 22, 18 16, 32 30 C 42 42, 36 58, 20 58 C 12 58, 4 48, 12 40 Z" fill="url(#kauvery-icon-bottom)" opacity="0.92" />
