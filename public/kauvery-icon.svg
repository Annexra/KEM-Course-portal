<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="kauvery-icon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E60067" />
    </linearGradient>
    <linearGradient id="kauvery-icon-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#8A1562" />
    </linearGradient>
    <linearGradient id="kauvery-icon-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91B5C" />
      <stop offset="100%" stop-color="#670845" />
    </linearGradient>
  </defs>

  <g transform="translate(4, 8)">
